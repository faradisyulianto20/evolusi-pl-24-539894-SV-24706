name: Laravel CI

on:
  push:
    branches: [ "feature/*", "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Tests
        run: php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Echo Staging
        run: echo "Deploy ke server staging (simulasi)"

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Echo 7 Langkah Deploy
        run: |
          echo "1. Running: php artisan down --retry=60"
          echo "2. Running: git pull origin main"
          echo "3. Running: composer install --no-dev --optimize-autoloader"
          echo "4. Running: php artisan migrate --force"
          echo "5. Running: php artisan config:cache"
          echo "   Running: php artisan route:cache"
          echo "   Running: php artisan view:cache"
          echo "6. Running: php artisan queue:restart"
          echo "7. Running: php artisan up"
