name: CI Pipeline

on:
  push:
    branches: [ "feature/*", "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

# ─── BACKEND (Laravel) ─────────────────────────────────────────────────────────

jobs:
  build:
    name: Laravel – Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

  test:
    name: Laravel – Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Tests
        run: php artisan test

# ─── FRONTEND (Vue + Vite) ─────────────────────────────────────────────────────

  frontend-install:
    name: Frontend – Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

  frontend-lint:
    name: Frontend – Lint
    runs-on: ubuntu-latest
    needs: frontend-install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-test:
    name: Frontend – Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test

  frontend-build:
    name: Frontend – Build
    runs-on: ubuntu-latest
    needs: frontend-test
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Build (Vite)
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

# ─── DEPLOY ────────────────────────────────────────────────────────────────────

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Menunggu KEDUA pipeline (backend test + frontend build) hijau dulu
    needs: [ test, frontend-build ]
    # Deploy HANYA dari branch main — PR dan feature branch skip job ini
    if: github.ref == 'refs/heads/main'
    steps:
      # Ambil artifact dist/ hasil build dari job frontend-build.
      # Tidak ada npm run build di sini — artifact diteruskan langsung.
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # Tampilkan isi dist/ ke log sebagai bukti artifact berhasil diterima
      - name: Show dist/ contents
        run: |
          echo "========================================"
          echo "  Isi dist/ dari job frontend-build"
          echo "========================================"
          find dist/ -type f | sort
          echo ""
          echo "--- Ukuran total ---"
          du -sh dist/
          echo ""
          echo "--- Detail per file ---"
          ls -lhR dist/

      - name: Simulate staging deploy
        run: echo "Artifact frontend-dist diterima. Siap deploy ke staging."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Echo 7 Langkah Deploy
        run: |
          echo "1. Running: php artisan down --retry=60"
          echo "2. Running: git pull origin main"
          echo "3. Running: composer install --no-dev --optimize-autoloader"
          echo "4. Running: php artisan migrate --force"
          echo "5. Running: php artisan config:cache"
          echo "   Running: php artisan route:cache"
          echo "   Running: php artisan view:cache"
          echo "6. Running: php artisan queue:restart"
          echo "7. Running: php artisan up"
